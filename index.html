<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mask Detection AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Face Mask Detector</h1>
    <p>කැමරාව ක්‍රියාත්මක කර Mask එකක් පැළඳ සිටීදැයි පරීක්ෂා කරන්න.</p>
    
    <button type="button" id="start-btn" onclick="init()">කැමරාව අරඹන්න</button>
    
    <div id="video-container">
      <video id="webcam" autoplay playsinline muted width="250" height="250"></video>
    </div>
    <div id="label-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
