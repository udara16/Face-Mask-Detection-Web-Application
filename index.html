<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mask Detector</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>
<body>
  <div class="container">
    <h1>Face Mask Detector</h1>
    <p>කැමරාව ක්‍රියාත්මක කර මුහුණ පෙන්වන්න.</p>
    
    <button type="button" id="start-btn">කැමරාව අරඹන්න</button>
    
    <div id="video-wrapper">
      <video id="webcam" playsinline autoplay muted width="280" height="280"></video>
      <canvas id="overlay-canvas" width="280" height="280"></canvas>
    </div>

    <div id="status">බොත්තම ඔබන්න...</div>
    <div id="label-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
